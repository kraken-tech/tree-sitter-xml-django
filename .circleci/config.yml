version: 2.1

orbs:
  ktl-nexus: krakentech/ktl-nexus@8.1.0

executors:
  default:
    docker:
      # CRITICAL: Keep 3.14+.
      # tree-sitter-cli (v0.25+) requires GLIBC_2.39.
      # cimg/python:3.13 (and older) use Ubuntu 22.04 (GLIBC_2.35).
      # cimg/python:3.14 uses Ubuntu 24.04 (GLIBC_2.39).
      - image: cimg/python:3.14-node
    resource_class: small

jobs:
  lint:
    executor: default
    steps:
      - checkout
      - ktl-nexus/login
      - restore_cache:
          keys:
            - v1-uv-{{ checksum "uv.lock" }}
            - v1-uv-
      - restore_cache:
          keys:
            - v1-pre-commit-{{ checksum ".pre-commit-config.yaml" }}
            - v1-pre-commit-
      - run:
          name: Install dependencies
          command: make dev
      - run:
          name: Run pre-commit
          command: SKIP=no-commit-to-branch uv run pre-commit run --all-files
      - save_cache:
          key: v1-uv-{{ checksum "uv.lock" }}
          paths:
            - ~/.cache/uv
      - save_cache:
          key: v1-pre-commit-{{ checksum ".pre-commit-config.yaml" }}
          paths:
            - ~/.cache/pre-commit

  test:
    executor: default
    steps:
      - checkout
      - ktl-nexus/login
      - restore_cache:
          keys:
            - v1-uv-{{ checksum "uv.lock" }}
            - v1-uv-
      - run:
          name: Install dependencies
          command: make dev
      - run:
          name: Test grammar (corpus tests)
          command: npx tree-sitter test
      - run:
          name: Test Python bindings
          command: |
            mkdir -p test-results
            uv run pytest bindings/python/tests/ --junitxml=test-results/pytest.xml
      - store_test_results:
          path: test-results
      - save_cache:
          key: v1-uv-{{ checksum "uv.lock" }}
          paths:
            - ~/.cache/uv

  publish:
    executor: default
    steps:
      - checkout
      - run:
          name: Check if version already published
          command: |
            VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
            TAG="v${VERSION}"
            echo "export VERSION=$VERSION" >> "$BASH_ENV"
            echo "export TAG=$TAG" >> "$BASH_ENV"
            if git ls-remote --tags origin "refs/tags/$TAG" | grep -q .; then
              echo "Tag $TAG already exists — version $VERSION has been published. Skipping."
              circleci-agent step halt
            else
              echo "No tag for $TAG found — version $VERSION is new. Will publish."
            fi
      - ktl-nexus/login
      - ktl-nexus/configure_uv
      - run:
          name: Install build tools
          command: pipx install build twine
      - run:
          name: Build package
          command: make package
      - ktl-nexus/publish_python_package
      - run:
          name: Generate GitHub App installation token
          command: |
            echo "${GITHUB_APP_PRIVATE_KEY_BASE64}" | base64 -d > /tmp/gh_app_key.pem
            now=$(date +%s)
            header=$(printf '{"alg":"RS256","typ":"JWT"}' | base64 | tr -d '=\n' | tr '+/' '-_')
            payload=$(printf '{"iat":%s,"exp":%s,"iss":%s}' "$((now-60))" "$((now+540))" "${GITHUB_APP_ID}" | base64 | tr -d '=\n' | tr '+/' '-_')
            signature=$(printf '%s' "${header}.${payload}" | openssl dgst -sha256 -sign /tmp/gh_app_key.pem -binary | base64 | tr -d '=\n' | tr '+/' '-_')
            JWT="${header}.${payload}.${signature}"
            INSTALLATION_TOKEN=$(curl -sf \
              -X POST \
              -H "Authorization: Bearer ${JWT}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/app/installations/${GITHUB_APP_INSTALLATION_ID}/access_tokens" \
              | python3 -c "import sys,json; print(json.load(sys.stdin)['token'])")
            echo "export GITHUB_TOKEN=${INSTALLATION_TOKEN}" >> "$BASH_ENV"
            rm -f /tmp/gh_app_key.pem
      - run:
          name: Tag release on GitHub
          command: |
            git config user.email "ci-bot@kraken.tech"
            git config user.name "CI"
            git tag -a "$TAG" -m "Release $TAG"
            git push "https://x-access-token:${GITHUB_TOKEN}@github.com/kraken-tech/tree-sitter-xmldjango.git" "$TAG"

workflows:
  test-build-publish:
    jobs:
      - lint:
          context:
            - KTL_NEXUS
      - test:
          context:
            - KTL_NEXUS
      - publish:
          context:
            - KTL_NEXUS
            - ISSUANCE_TEAM
          requires:
            - lint
            - test
          filters:
            branches:
              only: main
