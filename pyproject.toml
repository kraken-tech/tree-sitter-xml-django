[build-system]
requires = ["setuptools>=62.4.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tree-sitter-xml-django"
description = "Django-XML template language grammar for tree-sitter"
version = "0.5.0"
keywords = ["incremental", "parsing", "tree-sitter", "xml-django"]
classifiers = [
  "Intended Audience :: Developers",
  "Topic :: Software Development :: Compilers",
  "Topic :: Text Processing :: Linguistic",
  "Typing :: Typed",
]
authors = [
  { name = "Laurent Putz", email = "laurent.putz@kraken.tech" },
  { name = "Hudson Gerwing", email = "hudson.gerwing@kraken.tech" },
]
requires-python = ">=3.10"
license = {text = "BSD-3-Clause"}
readme = "README.md"

[project.urls]
Homepage = "https://github.com/kraken-tech/tree-sitter-xml-django"

[project.optional-dependencies]
core = ["tree-sitter~=0.26"]

[dependency-groups]
dev = [
    "pre-commit>=3.0",
    "pytest>=8.0",
    "tree-sitter~=0.26",
]

[tool.cibuildwheel]
build = "cp310-*"
build-frontend = "build"
