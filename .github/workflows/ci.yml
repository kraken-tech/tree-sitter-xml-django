name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: make dev
      - run: SKIP=no-commit-to-branch uv run pre-commit run --all-files

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: make dev
      - run: npx tree-sitter test
      - run: uv run pytest bindings/python/tests/

  publish:
    needs: [lint, test]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      id-token: write  # required for PyPI trusted publishing
      contents: write  # required for pushing the release tag
    steps:
      - uses: actions/checkout@v4
      - name: Check if version already published
        id: check
        run: |
          VERSION=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          TAG="v${VERSION}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if git ls-remote --tags origin "refs/tags/$TAG" | grep -q .; then
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: astral-sh/setup-uv@v5
        if: steps.check.outputs.new == 'true'
      - name: Build package
        if: steps.check.outputs.new == 'true'
        run: uv build
      - name: Publish to PyPI
        if: steps.check.outputs.new == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
      - name: Tag release
        if: steps.check.outputs.new == 'true'
        run: |
          git config user.email "ci-bot@kraken.tech"
          git config user.name "CI"
          git tag -a "${{ steps.check.outputs.tag }}" -m "Release ${{ steps.check.outputs.tag }}"
          git push origin "${{ steps.check.outputs.tag }}"
